name: Live Check Basic Example

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-check-basic.yml'
      - 'basic/**'

permissions:
  contents: read

jobs:
  live-check-basic:
    name: Live Check Basic Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1

      - name: Build basic example
        run: make -C basic build

      - name: Start live-check
        id: live-check
        uses: open-telemetry/weaver/.github/actions/weaver-live-check-start@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1
        with:
          registry: ./basic/model

      - name: Run basic example
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ steps.live-check.outputs.otlp-grpc-endpoint }}
        run: cargo run --manifest-path basic/Cargo.toml -- "Hello, World!"

      - name: Stop live-check
        id: live-check-stop
        if: always()
        uses: open-telemetry/weaver/.github/actions/weaver-live-check-stop@38befce4bc68fe320d20f189465c93835ac20c12 # v0.26.1
        with:
          fail-on: violation

      - name: Print live-check result
        if: always()
        run: |
          echo "Weaver live-check result:"
          echo "  samples:      ${STEPS_LIVE_CHECK_STOP_OUTPUTS_SAMPLES}"
          echo "  violations:   ${STEPS_LIVE_CHECK_STOP_OUTPUTS_VIOLATIONS}"
          echo "  improvements: ${STEPS_LIVE_CHECK_STOP_OUTPUTS_IMPROVEMENTS}"
          echo "  information:  ${STEPS_LIVE_CHECK_STOP_OUTPUTS_INFORMATIONS}"
          echo
          echo "See the job summary for finding messages and download the weaver-live-check-report artifact for the full JSON report."
        env:
          STEPS_LIVE_CHECK_STOP_OUTPUTS_SAMPLES: ${{ steps.live-check-stop.outputs.samples }}
          STEPS_LIVE_CHECK_STOP_OUTPUTS_VIOLATIONS: ${{ steps.live-check-stop.outputs.violations }}
          STEPS_LIVE_CHECK_STOP_OUTPUTS_IMPROVEMENTS: ${{ steps.live-check-stop.outputs.improvements }}
          STEPS_LIVE_CHECK_STOP_OUTPUTS_INFORMATIONS: ${{ steps.live-check-stop.outputs.informations }}
